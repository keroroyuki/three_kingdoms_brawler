<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三国战纪 · 横版动作</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
    <div id="frame">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>
    <div id="tip">键盘操作 · WASD 移动 · J 攻击 · K 跳跃 · 空格 防御 · L 必杀 · M 静音 · Esc 暂停</div>
</div>
<script>
window.__lastErr = '';
window.addEventListener('error', function(e) {
    window.__lastErr = (e.filename || '') + ':' + (e.lineno || '') + ' ' + (e.message || e.error && e.error.stack);
    document.body.insertAdjacentHTML('beforeend', '<pre style="color:#f55;white-space:pre-wrap;font-size:12px;padding:10px;">' + window.__lastErr + '</pre>');
});
window.addEventListener('unhandledrejection', function(e) {
    window.__lastErr = 'PROMISE ' + (e.reason && e.reason.stack || e.reason);
    document.body.insertAdjacentHTML('beforeend', '<pre style="color:#f55;white-space:pre-wrap;font-size:12px;padding:10px;">' + window.__lastErr + '</pre>');
});
</script>

<script src="js/core/utils.js"></script>
<script src="js/core/constants.js"></script>
<script src="js/core/input.js"></script>
<script src="js/core/audio.js"></script>
<script src="js/art/figure.js"></script>
<script src="js/art/looks.js"></script>
<script src="js/art/scene.js"></script>
<script src="js/art/fx.js"></script>
<script src="js/entities/actor.js"></script>
<script src="js/entities/player.js"></script>
<script src="js/entities/enemy.js"></script>
<script src="js/entities/projectile.js"></script>
<script src="js/entities/items.js"></script>
<script src="js/level.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
</body>
</html>
